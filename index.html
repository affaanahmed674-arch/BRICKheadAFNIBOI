<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL SYSTEM OVERRIDE</title>
    <style>
        :root { --glitch-color: #0ff; --error-red: #ff3b3b; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: 'Courier New', monospace; }

        /* Scanning HUD Layer */
        #hud-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.05) 0px, rgba(0, 255, 255, 0.05) 1px, transparent 1px, transparent 2px);
            pointer-events: none; z-index: 9999;
        }

        /* The Ghost Cursor */
        #ghost-cursor {
            width: 20px; height: 20px; border: 2px solid var(--glitch-color);
            position: fixed; pointer-events: none; z-index: 10000;
            transition: transform 0.05s linear; box-shadow: 0 0 10px var(--glitch-color);
        }

        /* Fake Desktop Environments */
        #trap-zone {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; text-align: center; background-size: cover; background-position: center;
        }

        .terminal-box {
            background: rgba(0, 0, 0, 0.85); border: 1px solid var(--glitch-color);
            padding: 30px; color: var(--glitch-color); text-transform: uppercase;
            letter-spacing: 2px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            animation: pulse 2s infinite; backdrop-filter: blur(5px);
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        #rick-space { display: none; width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="hud-overlay"></div>
    <div id="ghost-cursor"></div>

    <div id="trap-zone" onclick="engageLockdown()">
        <div class="terminal-box">
            <h1 id="device-msg">ENCRYPTED LINK DETECTED</h1>
            <p id="sub-msg">UNAUTHORIZED ACCESS ATTEMPT...</p>
            <div style="margin-top: 20px; border: 1px solid #333; height: 5px; width: 200px; margin: 20px auto;">
                <div style="background: var(--glitch-color); height: 100%; width: 45%; animation: load 3s linear infinite;"></div>
            </div>
            <p style="font-size: 0.8rem;">[ CLICK TO BYPASS FIREWALL ]</p>
        </div>
    </div>

    <div id="rick-space">
        <iframe id="rickroll" src="" allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        const ghost = document.getElementById('ghost-cursor');
        const trapZone = document.getElementById('trap-zone');
        const rickSpace = document.getElementById('rick-space');
        const player = document.getElementById('rickroll');

        // 1. Device & Browser Intelligence
        const ua = navigator.userAgent;
        if (/iPad|iPhone|iPod/.test(ua)) {
            document.getElementById('device-msg').innerText = "iPadOS SYSTEM KERNEL ERROR";
            trapZone.style.backgroundImage = "url('https://wallpapers.com/images/featured/ipad-o86p627zt828646s.jpg')";
        } else if (/Windows/.test(ua)) {
            document.getElementById('device-msg').innerText = "WINDOWS SECURITY BREACH";
            trapZone.style.background = "#00429d";
        }

        // 2. Ghost Cursor Logic
        document.addEventListener('mousemove', (e) => {
            ghost.style.left = e.clientX + 'px';
            ghost.style.top = e.clientY + 'px';
            if(Math.random() > 0.95) { // Occasional glitch jitter
                ghost.style.transform = `translate(${Math.random()*10}px, ${Math.random()*10}px)`;
            }
        });

        // 3. The Point of No Return
        function engageLockdown() {
            // Fullscreen Hijack
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

            // Vibration Feedback (Android Only)
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);

            // Transition
            trapZone.style.display = 'none';
            rickSpace.style.display = 'block';
            player.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&loop=1&playlist=dQw4w9WgXcQ&disablekb=1";

            // History Flood (Disables Back Button)
            for(let i=0; i<100; i++) {
                window.history.pushState(null, "", window.location.href + "#lockdown_" + i);
            }

            // The Sticky Trap
            window.onbeforeunload = () => "System resources are locked.";
            
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    alert("⚠️ CRITICAL OVERRIDE DETECTED. RE-ESTABLISHING SECURE CONNECTION...");
                    if (el.requestFullscreen) el.requestFullscreen();
                }
            });
        }

        // Prevent standard exit keys
        document.onkeydown = (e) => {
            if ([122, 123, 73, 85].includes(e.keyCode) && (e.ctrlKey || e.shiftKey)) return false;
        };
    </script>

    <style>@keyframes load { 0% { width: 0%; } 100% { width: 100%; } }</style>
</body>
</html>
