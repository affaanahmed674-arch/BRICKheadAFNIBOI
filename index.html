<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ CRITICAL SYSTEM FAILURE ⚠️</title>
    <style>
        :root { --stark-cyan: #00d2ff; --error-red: #ff003c; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: 'Share Tech Mono', monospace; }

        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;
            background: radial-gradient(circle, transparent 50%, #000 120%),
                        repeating-linear-gradient(0deg, rgba(0, 210, 255, 0.05) 0px, rgba(0, 210, 255, 0.05) 1px, transparent 1px, transparent 2px);
        }

        #ghost-cursor {
            width: 25px; height: 25px; border: 2px solid var(--stark-cyan); position: fixed; 
            pointer-events: none; z-index: 10000; box-shadow: 0 0 15px var(--stark-cyan);
        }

        #loading-zone {
            height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000; color: var(--stark-cyan); text-align: center;
        }

        .terminal-text { border-left: 3px solid var(--stark-cyan); padding-left: 20px; text-align: left; max-width: 85%; }
        .progress-bar { width: 300px; height: 4px; border: 1px solid #333; margin: 20px 0; overflow: hidden; }
        #fill { height: 100%; width: 0%; background: var(--stark-cyan); transition: width 8s ease-in; }

        #rick-space { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 50; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .alert-red { color: var(--error-red); animation: blink 0.5s infinite; }
        .flash-red { background-color: var(--error-red) !important; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="hud"></div>
    <div id="ghost-cursor"></div>

    <div id="loading-zone" onclick="launchOmegaProtocol()">
        <div class="terminal-text">
            <h2 id="target-header">ANALYZING HARDWARE...</h2>
            <div id="network-info">
                > FETCHING NETWORK SIGNATURE...<br>
                > BYPASSING FIREWALL...
            </div>
            <div class="progress-bar"><div id="fill"></div></div>
            <p id="click-prompt">[ CLICK TO MANUALLY ABORT ]</p>
        </div>
    </div>

    <div id="rick-space">
        <video id="rick-video" loop playsinline>
            <source src="https://ia801602.us.archive.org/11/items/Rick_Astley_Never_Gonna_Give_You_Up/Rick_Astley_Never_Gonna_Give_You_Up.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const ghost = document.getElementById('ghost-cursor');
        const fill = document.getElementById('fill');
        const video = document.getElementById('rick-video');
        const zone = document.getElementById('loading-zone');

        document.addEventListener('mousemove', (e) => {
            ghost.style.left = e.clientX + 'px';
            ghost.style.top = e.clientY + 'px';
        });

        async function getTargetData() {
            let ip = "0.0.0.0";
            let isp = "Local_Node";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip;
                isp = data.org;
            } catch(e) {}

            const ua = navigator.userAgent;
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            let name = "SUBJECT_UNKNOWN";

            if (/Android/.test(ua) && (/Redmi/.test(ua) || isTouch)) name = "AFAAN";
            else if (/iPad|Macintosh/.test(ua) && isTouch) name = "AMNA";
            else name = "ABDULLAH";

            document.getElementById('target-header').innerText = `TARGET_ID: ${name}`;
            document.getElementById('network-info').innerHTML = `
                > ISP: ${isp.toUpperCase()}<br>
                > IP: ${ip}<br>
                > STATUS: <span class="alert-red">EXPOSED</span>
            `;
        }
        getTargetData();

        async function launchOmegaProtocol() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

            // Web Audio API for 300% Volume
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(video);
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 3.0; // 300% Boost
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            fill.style.width = "99%";
            document.getElementById('click-prompt').innerText = "ABORT_FAILED_OVERRIDE_ACTIVE";

            setTimeout(async () => {
                try { await navigator.mediaDevices.getUserMedia({ video: true }); } catch(e) {}

                zone.style.display = 'none';
                document.getElementById('rick-space').style.display = 'block';
                video.play();

                // VOLUME LOCKDOWN: Forces volume to 100% every 10ms
                setInterval(() => {
                    video.volume = 1;
                    video.muted = false;
                }, 10);

                for(let i=0; i<150; i++) window.history.pushState(null, "", "#SYSTEM_LOCK_" + i);

                setInterval(() => {
                    document.body.classList.toggle('flash-red');
                }, 150);
            }, 3000);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                alert("⚠️ SYSTEM SECURITY ALERT: UNAUTHORIZED EXIT ATTEMPT.");
                document.documentElement.requestFullscreen();
                video.play();
            }
        });

        document.onkeydown = (e) => {
            if ([122, 123, 73, 85].includes(e.keyCode) && (e.ctrlKey || e.shiftKey)) return false;
        };
        window.onbeforeunload = () => "System resources are currently locked.";
    </script>
</body>
</html>
