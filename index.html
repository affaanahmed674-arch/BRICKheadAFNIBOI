<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM CRITICAL - DO NOT CLOSE</title>
    <style>
        body { background: #000; color: #f00; font-family: 'Courier', monospace; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; cursor: crosshair; }
        #trap-overlay { text-align: center; z-index: 100; }
        iframe { width: 100vw; height: 100vh; border: none; display: none; }
        .blink { animation: blinker 0.1s step-start infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="trap-overlay" onclick="engageTrap()">
        <h1 class="blink">CRITICAL BREACH DETECTED</h1>
        <p>RECOVERY KEY REQUIRED: [CLICK TO INITIALIZE]</p>
    </div>

    <iframe id="rick" src="" allow="autoplay; encrypted-media"></iframe>

    <script>
        function engageTrap() {
            // 1. Go Fullscreen (The ultimate trap)
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }

            // 2. Hide UI and Show Rick
            document.getElementById('trap-overlay').style.display = 'none';
            const rick = document.getElementById('rick');
            rick.style.display = 'block';
            rick.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&playlist=dQw4w9WgXcQ&controls=0";

            // 3. Flood History
            for (let i = 0; i < 50; i++) {
                window.history.pushState(null, "", window.location.href);
            }

            // 4. Block Exit Attempt
            window.addEventListener('beforeunload', (e) => {
                e.preventDefault();
                e.returnValue = '';
            });
        }

        // Prevent Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
