<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emergency Alert</title>
    <style>
        :root { --uae-red: #d32f2f; --stark-cyan: #00d2ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; cursor: none; }
        
        /* SYSTEM MODAL */
        #amber-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 20000;
            justify-content: center; align-items: center;
        }
        .system-modal {
            background: #fdfdfd; width: 85%; max-width: 320px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,1); text-align: center;
            animation: vibe 0.1s infinite;
        }
        .modal-header { background: var(--uae-red); color: white; padding: 10px; font-weight: bold; font-size: 16px; border-bottom: 2px solid white; }
        .modal-body { padding: 18px; color: #111; font-size: 13px; line-height: 1.5; font-weight: 500; }
        .modal-btn { border-top: 1px solid #ddd; padding: 12px; color: #007aff; font-weight: 600; font-size: 17px; background: #eee; }

        @keyframes vibe { 0% { transform: scale(1); } 50% { transform: scale(1.01); } 100% { transform: scale(1); } }

        /* JUMPSCARE */
        #scare-space { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 25000; background: #000; }
        #scare-img { width: 100%; height: 100%; object-fit: cover; }

        /* HUD */
        #loading-zone { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--stark-cyan); font-family: 'Share Tech Mono', monospace; }
        #bar { width: 0%; height: 2px; background: var(--stark-cyan); transition: width 2s linear; margin-top: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="amber-alert">
        <div class="system-modal">
            <div class="modal-header">⚠️ Emergency Alert / تنبيه ⚠️</div>
            <div class="modal-body">
                <b>GOVERNMENT OF UAE: MOI</b><br><br>
                Unauthorized access detected from this IP. Location tracking is active. Stay where you are.<br><br>
                تم اكتشاف وصول غير مصرح به. تتبع الموقع نشط حاليا. ابق في مكانك.
            </div>
            <div class="modal-btn">OK</div>
        </div>
    </div>

    <div id="scare-space">
        <img id="scare-img" src="https://images2.imgbox.com/00/f8/pS9F9TTo_o.jpg" onerror="this.src='https://i.postimg.cc/85z1X2yv/scare.jpg'">
        <audio id="siren" loop src="https://files.catbox.moe/k20e9m.mp3"></audio>
        <audio id="scream" src="https://files.catbox.moe/5z5z6n.mp3"></audio>
    </div>

    <div id="loading-zone" onclick="ignite()">
        <div style="border-left: 2px solid var(--stark-cyan); padding-left: 15px;">
            <h2 id="tag">UPLINK_INITIALIZED</h2>
            <div id="info">> SYNCING_NODES...</div>
            <div id="bar"></div>
            <p id="status">[ OVERRIDE SECURITY ]</p>
        </div>
    </div>

    <script>
        const siren = document.getElementById('siren');
        const scream = document.getElementById('scream');
        const amber = document.getElementById('amber-alert');
        const scare = document.getElementById('scare-space');

        async function init() {
            let ip = "0.0.0.0";
            try { const res = await fetch('https://ipapi.co/json/'); const data = await res.json(); ip = data.ip; } catch(e){}

            const ua = navigator.userAgent;
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            
            let name = "ABDULLAH";
            if (/iPad/.test(ua)) name = "AMNA";
            else if (/Samsung|SM-T|SM-P/.test(ua)) name = "RABIA";
            else if (/Redmi|Android/.test(ua)) name = "AFAAN";
            else if (!isTouch) name = "ABDULLAH";

            document.getElementById('tag').innerText = `TARGET: ${name}`;
            document.getElementById('info').innerHTML = `> IP: ${ip}<br>> STATUS: EXPOSED`;
        }
        init();

        function forceLock() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            if (el.requestPointerLock) el.requestPointerLock();
        }

        function ignite() {
            forceLock();
            document.getElementById('bar').style.width = "100%";
            
            setTimeout(() => {
                document.getElementById('loading-zone').style.display = 'none';
                amber.style.display = 'flex';
                siren.volume = 1.0;
                siren.play();

                setInterval(() => {
                    if(!document.fullscreenElement && !document.webkitFullscreenElement) forceLock();
                }, 50);

                setTimeout(() => {
                    amber.style.display = 'none';
                    scare.style.display = 'block';
                    siren.pause();
                    scream.volume = 1.0;
                    scream.play();

                    // Violent Shake
                    setInterval(() => {
                        document.getElementById('scare-img').style.transform = `translate(${Math.random()*20-10}px, ${Math.random()*20-10}px)`;
                    }, 20);
                }, 3500);
            }, 1000);
        }

        document.addEventListener('keydown', (e) => e.preventDefault());
    </script>
</body>
</html>
