<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL SYSTEM UPDATE</title>
    <style>
        body, html {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }

        #overlay {
            z-index: 10;
            cursor: pointer;
        }

        .glitch-text {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        #rickroll-container {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startPrank()">
        <div class="glitch-text">CRITICAL SYSTEM ERROR</div>
        <p>[ CLICK TO RECOVER DATA ]</p>
        <p style="font-size: 12px; color: #555;">Scanning local sectors...</p>
    </div>

    <div id="rickroll-container">
        <iframe 
            id="video"
            src="" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function startPrank() {
            // Hide the bait
            document.getElementById('overlay').style.display = 'none';
            
            // Show the container
            const container = document.getElementById('rickroll-container');
            container.style.display = 'block';

            // Set the video source with autoplay and loud volume
            const video = document.getElementById('video');
            video.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0";
        }
    </script>
</body>
</html>
