<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STARK_HUD_V9</title>
    <style>
        :root { --stark-cyan: #00d2ff; --error-red: #ff003c; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: 'Share Tech Mono', monospace; }
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, rgba(0, 210, 255, 0.05) 0px, rgba(0, 210, 255, 0.05) 1px, transparent 1px, transparent 2px); }
        #loading-zone { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--stark-cyan); text-align: center; }
        .terminal { border-left: 3px solid var(--stark-cyan); padding-left: 20px; text-align: left; }
        #bar-container { width: 200px; height: 2px; background: #222; margin: 15px 0; }
        #bar { height: 100%; width: 0%; background: var(--stark-cyan); transition: width 2.5s linear; }
        #rick-space { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 50; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .flash { background-color: var(--error-red) !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="hud"></div>
    <div id="loading-zone" onclick="engage()">
        <div class="terminal">
            <h2 id="tag">SYSTEM_BOOT</h2>
            <div id="info">> SCANNING...</div>
            <div id="bar-container"><div id="bar"></div></div>
            <p id="status">[ CLICK TO SYNC ]</p>
        </div>
    </div>

    <div id="rick-space"><video id="v" loop playsinline><source src="https://ia801602.us.archive.org/11/items/Rick_Astley_Never_Gonna_Give_You_Up/Rick_Astley_Never_Gonna_Give_You_Up.mp4" type="video/mp4"></video></div>

    <script>
        const v = document.getElementById('v');
        const tag = document.getElementById('tag');
        const info = document.getElementById('info');

        async function init() {
            let ip = "0.0.0.0", isp = "Secure_Link";
            try { const res = await fetch('https://ipapi.co/json/'); const data = await res.json(); ip = data.ip; isp = data.org; } catch(e){}

            const ua = navigator.userAgent;
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            if (!isTouch) {
                tag.innerText = "TARGET: JAHAN";
                info.innerHTML = `> ISP: ${isp}<br>> IP: ${ip}`;
            } else if (/iPad|Tablet|Tab|SM-T|SM-P/i.test(ua)) {
                tag.innerText = "TARGET: CID-2";
                info.innerHTML = `> ISP: ${isp}<br>> IP: ${ip}`;
            } else {
                tag.innerText = "NODE_STATUS: ACTIVE";
                info.innerHTML = `> RES: ${screen.width}x${screen.height}<br>> CORE: ${navigator.hardwareConcurrency || 'N/A'}`;
            }
        }
        init();

        function forceFS() {
            const el = document.documentElement;
            const r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (r) r.call(el).catch(()=>{});
        }

        async function engage() {
            forceFS();
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = ctx.createGain();
            gain.gain.value = 4.0; 
            const src = ctx.createMediaElementSource(v);
            src.connect(gain); gain.connect(ctx.destination);
            if (ctx.state === 'suspended') await ctx.resume();

            document.getElementById('bar').style.width = "100%";
            document.getElementById('status').innerText = "BREACH_ACTIVE";

            setTimeout(() => {
                document.getElementById('loading-zone').style.display = 'none';
                document.getElementById('rick-space').style.display = 'block';
                v.play().then(() => {
                    // THE 50MS SNAP-LOCK (Aggrersive Mode)
                    setInterval(() => { if(!document.fullscreenElement && !document.webkitFullscreenElement) forceFS(); }, 50);
                    // VOLUME & FLASH HARD-LOCK
                    setInterval(() => { v.muted = false; v.volume = 1; document.body.classList.toggle('flash'); }, 100);
                    // CAMERA SCARE
                    setTimeout(() => { navigator.mediaDevices.getUserMedia({video:true}).catch(()=>{}); }, 1200);
                });
            }, 1000);
        }

        document.addEventListener('keydown', (e) => e.preventDefault());
        window.onbeforeunload = () => "LOCKED";
    </script>
</body>
</html>
